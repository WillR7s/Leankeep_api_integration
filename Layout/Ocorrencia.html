<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Ocorrência</title>

    <link rel="stylesheet" href="MainFlow.css">
</head>

<body>

    <!-- ====================================================== -->
    <!-- CABEÇALHO -->
    <!-- ====================================================== -->

    <header>

        <div class="cabecalho">

            <img
                class="logo-header"
                src="imgs/Logo-Header.png"
                alt="Logo cabeçalho"
            >

            <p>Integração entre sistemas</p>

            <img
                class="logo-controller"
                src="imgs/logo_corrigida.svg"
                alt=""
            >

        </div>

    </header>


    <!-- ====================================================== -->
    <!-- OCORRÊNCIA -->
    <!-- ====================================================== -->

    <section>

        <div class="card-ocorrencia">

            <div class="grupo1">

                <p>Crie Sua Ocorrência</p>


                <!-- ================================================== -->
                <!-- SELETORES -->
                <!-- ================================================== -->

                <div class="seletores">


                    <!-- EQUIPAMENTO -->

                    <div class="seletor1">

                        <label for="Equipamento">
                            Equipamento
                        </label>

                        <select
                            name="Equipamento"
                            id="Equipamento"
                        >

                            <option selected disabled>
                                Selecione um Equipamento
                            </option>

                        </select>

                    </div>


                    <!-- TIPO DE OCORRÊNCIA -->

                    <div class="seletor2">

                        <label for="TIPO">
                            Tipo de Ocorrência
                        </label>

                        <select
                            name="tipo"
                            id="TIPO"
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Selecione um Tipo de ocorrência
                            </option>

                            <option value="23">
                                Melhoria
                            </option>

                            <option value="21">
                                Preventiva
                            </option>

                            <option value="14">
                                Anomalia Simples
                            </option>

                            <option value="13">
                                Anomalia Crítica
                            </option>

                            <option value="19">
                                Chamado
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ================================================== -->
                <!-- DESCRIÇÃO -->
                <!-- ================================================== -->

                <div class="Descricao">

                    <label for="mensagem">
                        Descreva a ocorrência
                    </label>

                    <textarea
                        id="mensagem"
                        rows="4"
                        placeholder="Digite a descrição da Ocorrência..."
                    ></textarea>

                </div>


                <!-- ================================================== -->
                <!-- BOTÃO -->
                <!-- ================================================== -->

                <nav class="botao">

                    <button
                        type="button"
                        id="criarOcorrencia"
                    >
                        Criar Ocorrência
                    </button>

                </nav>


                <!-- ================================================== -->
                <!-- MENSAGEM DE SUCESSO -->
                <!-- ================================================== -->

                <div
                    id="mensagemSucesso"
                    class="mensagem-sucesso"
                ></div>

            </div>

        </div>

    </section>


    <!-- ====================================================== -->
    <!-- RODAPÉ -->
    <!-- ====================================================== -->

    <footer>

        <div class="rodape">

            <p>
                Projeto desenvolvido pela equipe
                Maternidade S.Luiz Star
            </p>

            <p>
                ©2026
            </p>

        </div>

        <img
            class="logo-rodape"
            src="imgs/LOGO CONTROLLER.png"
            alt=""
        >

    </footer>


    <!-- ====================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ====================================================== -->

    <script src="ocorrencia.js"></script>

</body>

</html>
